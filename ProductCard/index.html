<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Products</h1>
  </header>

  <section>
    <div class="card-container">

      <div class="card">
        <img src="assets/images/laptop.png">
        <h2>Laptop</h2>
        <p>$1200</p>
        <span>⭐ 4.8</span>

        <div class="actions">
          <button id="addButton">Add Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="assets/images/keyboard.png">
        <h2>Keyboard</h2>
        <p>$80</p>
        <span>⭐ 4.4</span>

        <div class="actions">
          <button id="addButton">Add Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="assets/images/headphone.png">
        <h2>Headphone</h2>
        <p>$120</p>
        <span>⭐ 4.2</span>

        <div class="actions">
          <button id="addButton">Add Cart</button>
        </div>
      </div>

    </div>
  </section>
</body>
<script src="script.js"></script>

</html>
