<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Challenge 01 - Profile Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="profile-card">

    <div class="cover"></div>

    <section class="profile-content">

      <div class="profile-image">
        <span>VL</span>
      </div>

      <h1>Vincent</h1>

      <p class="role">
        AI Engineer & Full-Stack Developer
      </p>

      <p class="description">
        Learning Python, JavaScript, Machine Learning,
        and building useful applications.
      </p>

      <div class="stats">

        <div class="stat">
          <strong>12</strong>
          <span>Projects</span>
        </div>

        <div class="stat">
          <strong id="followers">320</strong>
          <span>Followers</span>
        </div>

        <div class="stat">
          <strong>180</strong>
          <span>Following</span>
        </div>

      </div>

      <div class="actions">

        <button id="followButton">
          Follow
        </button>

        <button id="messageButton">
          Message
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
